<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/src/assets/images/Logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LITL MIS</title>
  <style>
    html,
    body,
    #root {
      min-height: 100%;
    }

    body {
      margin: 0;
    }

    .boot-loader {
      display: grid;
      min-height: 100vh;
      place-items: center;
      background: #f4f7fb;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .boot-loader__content {
      display: grid;
      justify-items: center;
      gap: 16px;
      color: #64748b;
      font-size: 16px;
      font-weight: 800;
    }

    .boot-loader__logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      transform-origin: 50% 92%;
      animation: boot-logo-wave 1.45s cubic-bezier(0.45, 0, 0.25, 1) infinite;
      filter: drop-shadow(0 12px 18px rgba(15, 23, 42, 0.14));
      will-change: transform, filter;
    }

    @keyframes boot-logo-wave {
      0% {
        transform: translateY(0) rotate(-6deg) scale(1);
        filter: drop-shadow(0 10px 14px rgba(15, 23, 42, 0.12));
      }

      22% {
        transform: translateY(-5px) rotate(7deg) scale(1.03);
        filter: drop-shadow(0 18px 22px rgba(15, 23, 42, 0.16));
      }

      44% {
        transform: translateY(0) rotate(-4deg) scale(1);
      }

      64% {
        transform: translateY(-3px) rotate(4deg) scale(1.02);
      }

      82% {
        transform: translateY(0) rotate(-2deg) scale(1);
      }

      100% {
        transform: translateY(0) rotate(-6deg) scale(1);
        filter: drop-shadow(0 10px 14px rgba(15, 23, 42, 0.12));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot-loader__logo {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="boot-loader" role="status" aria-live="polite">
      <div class="boot-loader__content">
        <img class="boot-loader__logo" src="/src/assets/images/Logo.png" alt="" aria-hidden="true" />
        <span>Loading...</span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
